name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (required by xgboost on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest --cov=src --cov-report=term-missing

  smoke:
    name: App startup smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP runtime (required by xgboost on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Launch app headless and check it responds
        working-directory: src
        shell: bash
        run: |
          streamlit run main.py --server.headless true --server.port 8501 &
          APP_PID=$!

          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8501 > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$APP_PID" 2>/dev/null || true

          if [ "$ready" -ne 1 ]; then
            echo "App did not respond on port 8501 within the expected time"
            exit 1
          fi

          echo "App started and responded successfully"
